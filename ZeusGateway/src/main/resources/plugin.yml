name: ZeusGateway
version: '1.0-SNAPSHOT'
main: org.vennv.zeusGateway.ZeusGateway
description: Zeus packet-forwarding plugin for Spigot, Paper, and Folia
authors:
  - VennDev
depend:
  - packetevents
folia-supported: true
commands:
  zeusdebug:
    description: View Zeus Gateway UDP packet transmissions in chat
    usage: /zeusdebug <on [player] [filter]|off|status>
    permission: zeusgateway.debug.self
permissions:
  zeusgateway.debug.self:
    description: View transmitted Zeus packets for yourself
    default: true
  zeusgateway.debug.others:
    description: View transmitted Zeus packets for another player
    default: op
